[package]
name = "kura-runner"
description = "Measures kura against the kura-bench contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
benchrs.workspace = true
serde_json.workspace = true
# Pinned to a commit rather than a branch, because a benchmark that moves when
# the engine moves cannot be compared against the run before it. Bumping this is
# a change with a number attached.
kura-core = { git = "https://github.com/tamnd/kura", rev = "8b25ce5fc2b694438e60f050d61a9c29bc581f5b" }
memmap2 = "0.9.9"
