[package]
name = "tantivy-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Measures Tantivy against the kura-bench contract"
license = "MIT"

[dependencies]
tantivy = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
] }

[profile.release]
# The comparison is against engines built the way their users build them, so
# this is the profile a deployment would use and not a faster one invented for
# the benchmark.
opt-level = 3
lto = "thin"
codegen-units = 1
