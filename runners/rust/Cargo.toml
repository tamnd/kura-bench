# The Rust runners share everything except the engine.
#
# Reading the corpus, taking the process counters, describing the machine and
# writing the result all have to be identical between engines or the comparison
# is between the measuring code rather than the engines, so they live in one
# library and each runner is a thin binary on top of it.
[workspace]
resolver = "3"
members = ["benchrs", "tantivy", "seekstorm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.dependencies]
benchrs = { path = "benchrs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# The comparison is against engines built the way their users build them, so
# this is the profile a deployment would use and not a faster one invented for
# the benchmark.
opt-level = 3
lto = "thin"
codegen-units = 1
