name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel an in-flight run when a branch is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build and test the harness on Linux and macOS with the race detector on.
  # gofmt and vet run here too so a formatting slip fails fast on both
  # platforms.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -s -w:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test -race -count=1 ./...

  # Every measurement here is taken by process level counters, and those are
  # written three times: once for Linux, once for macOS and once for Windows.
  # Cross compiling is the only thing that catches a mistake in the two that the
  # runner is not on.
  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: build
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  # The Rust runners live in one cargo workspace with their own toolchain, and
  # they share the platform specific counter code that the Go side also has.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: runners/rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runners/rust
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo build
        run: cargo build --release
      - name: cargo test
        run: cargo test

  # A real run, on real files, on every pull request.
  #
  # The corpus is this checkout, which is small enough to finish in a minute and
  # is genuine source rather than generated text. It proves the whole path:
  # corpus builder, every runner, two processes per engine, the merge and the
  # report. A harness that only ever ran on a developer's laptop is a harness
  # that has silently stopped working.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runners/rust
      - name: build everything
        run: make build
      - name: build a corpus from this checkout
        run: ./bin/kura-corpus -repo kura-bench=. -out corpus.jsonl
      - name: run every engine
        run: ./bin/kura-bench -corpus corpus.jsonl -queries queries.txt -bin bin -out results -repeat 3
      - name: show the report
        run: cat results/report-*.md
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: results/

  # The same thing for the vector suite, on siftsmall.
  #
  # Five megabytes of real descriptors with the ground truth the people who
  # published them computed, which is small enough to fetch and run on every
  # pull request and is still a real measurement. The exact scan is the check
  # that matters: it has to come back at recall 1.0000 against that published
  # ground truth, and anything else means the harness is reading the files
  # wrongly and every other figure it has ever printed is wrong the same way.
  #
  # Both metrics run because they exercise different code. Euclidean uses the
  # published ground truth and covers hnsw, inner product is computed and cached
  # here and covers turbovec, which ranks by inner product and nothing else.
  vector-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runners/rust
      - name: build everything
        run: make build
      - name: fetch siftsmall
        run: ./bin/kura-vectors -dataset siftsmall -out vecdata
      - name: compute the inner product ground truth
        run: ./bin/kura-vectors -dataset siftsmall -metric inner-product -out vecdata
      - name: euclidean
        run: >
          ./bin/kura-vecbench -dataset siftsmall -metric euclidean
          -data vecdata -bin bin -out results -queries 100
          -engines exact,hnsw
      # The one figure in this suite that has a known right answer, so it is
      # asserted rather than printed and left for somebody to notice.
      - name: the exact scan agrees with the published ground truth
        run: |
          recall=$(jq '.search.points[0].recall' results/vec-exact-siftsmall-euclidean-*.json)
          echo "the exact scan scored $recall"
          if [ "$recall" != "1" ]; then
            echo "it has to be 1, so the dataset is being read wrongly and every other figure is wrong the same way"
            exit 1
          fi
      - name: inner product
        run: >
          ./bin/kura-vecbench -dataset siftsmall -metric inner-product
          -data vecdata -bin bin -out results -queries 100
          -engines exact,turbovec
      - name: show the reports
        run: cat results/vector-report-*.md
      - uses: actions/upload-artifact@v4
        with:
          name: vector-smoke-results
          path: results/

  # The same thing for the graph suite, on ca-GrQc.
  #
  # Five megabytes of collaboration data from Arxiv, 5,242 authors and 28,980
  # edges, small enough to fetch and run on every pull request and still a real
  # graph rather than a generated one.
  #
  # The check that matters here is the correctness column. The answers are
  # worked out once in Go by walking the edge list the plainest way there is,
  # and every runner is a separate implementation in another language, so an
  # engine that disagrees is a real disagreement and not a rounding difference.
  # A graph store that dropped half the edges answers every question faster than
  # one that did not, and no timing column would ever say so.
  graph-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runners/rust
      - name: build everything
        run: make build
      - name: fetch ca-GrQc and work out the answers
        run: ./bin/kura-graphs -dataset ca-grqc -out graphdata
      - name: run every engine
        run: >
          ./bin/kura-graphbench -dataset ca-grqc
          -data graphdata -bin bin -out results
      # The subgraph path has its own answers worked out on the smaller graph,
      # so a mistake in it shows up as a disagreement in the same check below
      # rather than as a plausible looking number nobody can question.
      - name: prepare a subgraph and run it too
        run: |
          ./bin/kura-graphs -dataset ca-grqc -nodes 2000 -out graphdata
          ./bin/kura-graphbench -graph graphdata/ca-grqc-n2000 -bin bin -out results
      - name: every engine agrees with the reference
        run: |
          fail=0
          for f in results/graph-*.json; do
            engine=$(jq -r '.engine' "$f")
            graph=$(jq -r '.dataset.name' "$f")
            for op in $(jq -r '.query.ops[] | select(.unsupported == "") | select(.correct != 1) | .op' "$f"); do
              echo "$engine disagrees with the reference on $op over $graph"
              fail=1
            done
          done
          if [ "$fail" = 1 ]; then
            echo "an engine is answering a different question from the one the answers describe, so its timings mean nothing"
            exit 1
          fi
          echo "every engine agrees on every operation"
      - name: show the report
        run: cat results/graph-report-*.md
      - uses: actions/upload-artifact@v4
        with:
          name: graph-smoke-results
          path: results/

  # golangci-lint bundles staticcheck, govet, ineffassign, errcheck, unused and
  # more, so it is the main quality gate.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  # Scan the module and its dependencies for known vulnerabilities.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # Confirm go.mod and go.sum are tidy: a pull request that adds an import
  # without running go mod tidy fails here instead of breaking a later release.
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  # This repository is MIT, so the allow-list is the permissive set only. The
  # engines being measured are dependencies here, and one of them arriving under
  # a copyleft license is worth knowing about before a release rather than
  # after.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: go-licenses check
        run: |
          go install github.com/google/go-licenses@latest
          # modernc.org/mathutil ships the BSD 3-Clause text verbatim but
          # without the title line the classifier keys on, so it comes back as
          # unknown. It is checked by hand and it is BSD 3-Clause.
          go-licenses check ./... \
            --ignore modernc.org/mathutil \
            --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0,Unlicense,BSD-3-Clause-Clear
